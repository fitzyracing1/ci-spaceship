name: mission

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"   # long run every 6h with more random faults

permissions:
  contents: read

jobs:
  mission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Grader lock (dark if checks/ differs from pinned manifest)
        run: |
          sha256sum checks/* | diff -u .github/checks.lock - || {
            echo "## LIGHT: DARK (checks/ was modified; grader lock broken)" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
      - name: Solver must not read ground truth
        run: |
          if grep -rnE "checks/|truth" solver/; then
            echo "## LIGHT: DARK (solver references the grader)" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
      - run: npm test
      - name: Pick mission profile
        id: p
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "profile=long" >> "$GITHUB_OUTPUT"; echo "count=2000" >> "$GITHUB_OUTPUT"; echo "seed=$RANDOM$RANDOM" >> "$GITHUB_OUTPUT"
          else
            echo "profile=short" >> "$GITHUB_OUTPUT"; echo "count=100" >> "$GITHUB_OUTPUT"; echo "seed=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate scenario
        run: node scenarios/generate.mjs --seed ${{ steps.p.outputs.seed }} --count ${{ steps.p.outputs.count }} --profile ${{ steps.p.outputs.profile }} --out feed.json
      - name: Canary (unsolved feed must grade dark)
        run: |
          node -e "const f=require('./feed.json');require('fs').writeFileSync('raw.json',JSON.stringify(f.transfers))"
          node checks/grade.mjs --seed ${{ steps.p.outputs.seed }} --count ${{ steps.p.outputs.count }} --solved raw.json --expect-dark
      - name: Solve
        run: node solver/solve.mjs --feed feed.json --out solved.json
      - name: Grade (LIGHT)
        run: node checks/grade.mjs --seed ${{ steps.p.outputs.seed }} --count ${{ steps.p.outputs.count }} --solved solved.json
      - name: Live feed crawl
        run: |
          SEED=${{ steps.p.outputs.seed }} PROFILE=long node scenarios/server.mjs & sleep 1
          node solver/solve.mjs --url http://127.0.0.1:8787 --max 300

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint, debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ci-spaceship-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: android/app/build/reports/
          retention-days: 7
